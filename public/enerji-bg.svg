<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#06284a"/>
    <stop offset="45%" stop-color="#104b78"/>
    <stop offset="72%" stop-color="#d9783d"/>
    <stop offset="100%" stop-color="#f3a33f"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#344a5a"/>
    <stop offset="100%" stop-color="#17242e"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#b7c3ce"/>
  </linearGradient>
  <radialGradient id="sun">
    <stop offset="0%" stop-color="#fff9cc" stop-opacity="1"/>
    <stop offset="30%" stop-color="#ffd978" stop-opacity=".85"/>
    <stop offset="100%" stop-color="#ff9b37" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect width="1920" height="1080" fill="url(#sky)"/>
<circle cx="120" cy="650" r="130" fill="url(#sun)" filter="url(#blur)"/>
<path d="M0 670 L250 560 L500 650 L760 540 L1000 650 L1260 535 L1540 645 L1920 555 L1920 760 L0 760 Z" fill="#1d3140" opacity=".45" filter="url(#soft)"/>

<!-- Ground -->
