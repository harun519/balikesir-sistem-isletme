name: User Management UI Fix
on:
  push:
    paths:
      - '.github/workflows/user-management-ui-fix.yml'
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Improve connected state and readability
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/kullanicilar/page.tsx')
          s=p.read_text()
          old='''  <section className="connections">\n   <form className="connectBox" onSubmit={connectSupabase}><div><b>Supabase Yönetici Girişi</b><span>Trafo, SCADA ve Görüntülü Teyit için mevcut yönetici hesabın.</span></div><input type="email" placeholder="Yönetici e-posta" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} required/><input type="password" placeholder="Şifre" value={adminPassword} onChange={e=>setAdminPassword(e.target.value)} required/><button disabled={!!busy}>{busy==="connect"?"Bağlanıyor...":"Bağlan"}</button></form>\n   <form className="connectBox crm" onSubmit={connectCrm}><div><b>CRM Yönetici Girişi</b><span>CRM giriş ekranındaki Admin kullanıcı adı ve şifresi.</span></div><input placeholder="CRM Admin kullanıcı adı" value={crmAdmin} onChange={e=>setCrmAdmin(e.target.value)} required/><input type="password" placeholder="Şifre" value={crmPassword} onChange={e=>setCrmPassword(e.target.value)} required/><button disabled={!!busy}>{busy==="crmconnect"?"Bağlanıyor...":"Bağlan"}</button></form>\n  </section>'''
          new='''  <section className="connections">\n   {sharedToken&&teyitToken?<div className="connectBox connected"><div className="connectedMark">✓</div><div><b>Supabase Yönetici Bağlantısı Hazır</b><span>Trafo, SCADA ve Görüntülü Teyit kullanıcıları aşağıda yönetilebilir.</span></div><strong>BAĞLI</strong></div>:<form className="connectBox" onSubmit={connectSupabase}><div><b>Supabase Yönetici Girişi</b><span>Trafo, SCADA ve Görüntülü Teyit için mevcut yönetici hesabın.</span></div><input type="email" placeholder="Yönetici e-posta" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} required/><input type="password" placeholder="Şifre" value={adminPassword} onChange={e=>setAdminPassword(e.target.value)} required/><button disabled={!!busy}>{busy==="connect"?"Bağlanıyor...":"Bağlan"}</button></form>}\n   {crmConnected?<div className="connectBox connected crm"><div className="connectedMark">✓</div><div><b>CRM Yönetici Bağlantısı Hazır</b><span>CRM kullanıcıları aşağıda yönetilebilir.</span></div><strong>BAĞLI</strong></div>:<form className="connectBox crm" onSubmit={connectCrm}><div><b>CRM Yönetici Girişi</b><span>CRM giriş ekranındaki Admin kullanıcı adı ve şifresi.</span></div><input placeholder="CRM Admin kullanıcı adı" value={crmAdmin} onChange={e=>setCrmAdmin(e.target.value)} required/><input type="password" placeholder="Şifre" value={crmPassword} onChange={e=>setCrmPassword(e.target.value)} required/><button disabled={!!busy}>{busy==="crmconnect"?"Bağlanıyor...":"Bağlan"}</button></form>}\n  </section>'''
          if old not in s: raise SystemExit('connections block not found')
          s=s.replace(old,new,1)
          replacements={
            '.connectBox b{font-size:11px}':'.connectBox b{font-size:14px}',
            '.connectBox span{font-size:8px;color:#8fa8c0;margin-top:3px}':'.connectBox span{font-size:11px;color:#9db4c9;margin-top:4px;line-height:1.35}',
            '.privacy{margin:8px 2px 0;color:#718aa3;font-size:8px}':'.privacy{margin:10px 2px 0;color:#8fa8c0;font-size:11px}',
            '.panelTitle small{font-size:8px;letter-spacing:2px;color:#60a5fa;font-weight:900}':'.panelTitle small{font-size:10px;letter-spacing:2px;color:#60a5fa;font-weight:900}',
            '.panelTitle p{font-size:9px;color:#8fa8c0;margin:0}':'.panelTitle p{font-size:12px;color:#9db4c9;margin:0}',
            '.identity label{font-size:9px;font-weight:900;color:#a8bfd3}':'.identity label{font-size:12px;font-weight:900;color:#c0d0df}',
            '.roleBox>b{font-size:10px;margin:6px 0 8px}':'.roleBox>b{font-size:13px;margin:8px 0 10px}',
            '.legend{margin-top:10px;border-radius:13px;padding:11px 14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:9px;color:#a8bfd3}':'.legend{margin-top:10px;border-radius:13px;padding:13px 15px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:12px;color:#c0d0df}',
            '.appHead h3{margin:0;font-size:12px}':'.appHead h3{margin:0;font-size:15px}',
            '.empty{padding:25px;text-align:center;color:#7890a8;font-size:9px}':'.empty{padding:25px;text-align:center;color:#94aac0;font-size:12px}',
            '.userRow label{font-size:7px;color:#7f96ad;font-weight:900}':'.userRow label{font-size:11px;color:#9db4c9;font-weight:900}',
            '.userRow select{display:block;width:100%;height:33px;margin-top:4px;font-size:9px}':'.userRow select{display:block;width:100%;height:38px;margin-top:5px;font-size:13px}',
            '.who b{font-size:10px}':'.who b{font-size:13px}',
            '.who span{font-size:7px;color:#7890a8;margin-top:3px}':'.who span{font-size:10px;color:#91a7bc;margin-top:4px}'
          }
          for a,b in replacements.items():
            if a not in s: raise SystemExit('missing css fragment: '+a)
            s=s.replace(a,b,1)
          marker='.connectBox.crm button{background:#0891b2}'
          extra='''.connectBox.connected{grid-template-columns:auto 1fr auto;background:linear-gradient(180deg,#0b3d36,#0a302d);border-color:#1c8a72}.connectBox.connected.crm{background:linear-gradient(180deg,#0b3541,#0a2a35);border-color:#1389a6}.connectBox.connected strong{font-size:11px;letter-spacing:1px;color:#86efac;background:#065f46;padding:8px 11px;border-radius:999px}.connectedMark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#10b981;color:#fff;font-size:22px;font-weight:900}\n'''
          if marker not in s: raise SystemExit('connect css marker missing')
          s=s.replace(marker,marker+'\n'+extra,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/kullanicilar/page.tsx
          git commit -m 'Polish central user management connections and text' || exit 0
          git push
