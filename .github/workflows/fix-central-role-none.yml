name: Fix Central Role State
on:
  push:
    paths:
      - '.github/workflows/fix-central-role-none.yml'
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch central user manager
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/kullanicilar/page.tsx')
          s=p.read_text()
          old='''  if([form.trafo,form.scada,form.teyit,form.crm].every(x=>x==="none")){setBusy("");setError("En az bir uygulama için yetki seçmelisin.");return}\n'''
          if old not in s:
              raise SystemExit('all-none guard not found')
          s=s.replace(old,'',1)
          old='''   if(form.trafo!=="none"||form.scada!=="none"){\n    if(!sharedToken)fail.push("Trafo/SCADA yönetici bağlantısı yok");\n    else try{const d=await portalCall("shared",sharedToken,{action:"save",email,password:form.password,trafoRole:form.trafo==="none"?null:form.trafo,scadaRole:form.scada==="none"?null:form.scada});setSharedUsers(d.users||[]);ok.push("Trafo/SCADA")}catch(err:any){fail.push(`Trafo/SCADA: ${err.message}`)}\n   }\n   if(form.teyit!=="none"){\n    if(!teyitToken)fail.push("Görüntülü Teyit yönetici bağlantısı yok");\n    else try{const d=await portalCall("teyit",teyitToken,{action:"save",email,password:form.password,role:form.teyit});setTeyitUsers(d.users||[]);ok.push("Görüntülü Teyit")}catch(err:any){fail.push(`Görüntülü Teyit: ${err.message}`)}\n   }\n   if(form.crm!=="none"){\n    if(!crmConnected)fail.push("CRM yönetici bağlantısı yok");\n    else try{\n     const list=await crmCall("users:list");const existing=(list.users||[]).find((u:CrmUser)=>u.email?.toLowerCase()===email||u.username.toLowerCase()===username.toLowerCase());\n     if(existing)await crmCall("users:update",{id:existing.id,username,email,password:form.password,role:form.crm,active:true});\n     else await crmCall("users:create",{username,email,password:form.password,role:form.crm});\n     await refreshCrm();ok.push("CRM");\n    }catch(err:any){fail.push(`CRM: ${err.message}`)}\n   }\n'''
          new='''   if(sharedToken){\n    try{const d=await portalCall("shared",sharedToken,{action:"save",email,password:form.password,trafoRole:form.trafo==="none"?null:form.trafo,scadaRole:form.scada==="none"?null:form.scada});setSharedUsers(d.users||[]);ok.push("Trafo/SCADA")}catch(err:any){fail.push(`Trafo/SCADA: ${err.message}`)}\n   }else if(form.trafo!=="none"||form.scada!=="none")fail.push("Trafo/SCADA yönetici bağlantısı yok");\n   if(teyitToken){\n    try{const d=await portalCall("teyit",teyitToken,{action:"save",email,password:form.password,role:form.teyit==="none"?null:form.teyit});setTeyitUsers(d.users||[]);ok.push("Görüntülü Teyit")}catch(err:any){fail.push(`Görüntülü Teyit: ${err.message}`)}\n   }else if(form.teyit!=="none")fail.push("Görüntülü Teyit yönetici bağlantısı yok");\n   if(crmConnected){\n    try{\n     const list=await crmCall("users:list");const existing=(list.users||[]).find((u:CrmUser)=>u.email?.toLowerCase()===email||u.username.toLowerCase()===username.toLowerCase());\n     if(form.crm==="none"){if(existing)await crmCall("users:update",{id:existing.id,active:false})}\n     else if(existing)await crmCall("users:update",{id:existing.id,username,email,password:form.password,role:form.crm,active:true});\n     else await crmCall("users:create",{username,email,password:form.password,role:form.crm});\n     await refreshCrm();ok.push("CRM");\n    }catch(err:any){fail.push(`CRM: ${err.message}`)}\n   }else if(form.crm!=="none")fail.push("CRM yönetici bağlantısı yok");\n'''
          if old not in s:
              raise SystemExit('central app block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/kullanicilar/page.tsx
          git commit -m 'Apply Kapali roles across all four apps' || exit 0
          git push
